[build]
  publish = "."

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ============================================================
# URL CANONICALIZATION
#
# This file is the SINGLE source of truth for redirects. Do not
# add a _redirects file alongside it — when both exist the rules
# are merged and the precedence is easy to get wrong.
#
# Canonical form for this site is:
#     https://www.flexitechcontracting.com/<page>     (www, no .html)
#
# That matches every <link rel="canonical"> in the HTML, every
# <loc> in sitemap.xml, and the Sitemap: line in robots.txt.
# If you ever switch to the bare apex domain, all four have to
# change together or the canonical signals contradict each other.
#
# Netlify processes rules top to bottom; first match wins.
# ============================================================

# ---- 1. Host canonicalization: apex -> www ----
# Netlify's domain settings usually handle this, but declaring it
# explicitly keeps the behavior stable if the site config changes.
[[redirects]]
  from = "https://flexitechcontracting.com/*"
  to = "https://www.flexitechcontracting.com/:splat"
  status = 301
  force = true

# ---- 2. Recover dead legacy slug ----
# Reported as still sitting in Google's index from an older version
# of the site. Harmless if it was never indexed; recovers the link
# equity if it was. Verify in Search Console > Page Indexing.
[[redirects]]
  from = "/hidden-hills-pool-builder-custom-pools-spas"
  to = "/hidden-hills-pool-builder"
  status = 301

# ---- 3. Strip .html so only the clean URL is servable ----
# Netlify serves /services from services.html automatically; these
# rules make the .html form 301 to the clean form so the two don't
# both resolve as duplicate content.
#
# These are enumerated per page rather than written as a single
# "/*.html" wildcard: Netlify's splat matching is only reliable at
# the END of a path, so a mid-path "*.html" pattern is not
# dependable. Add a line here whenever you add a page.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

[[redirects]]
  from = "/gallery.html"
  to = "/gallery"
  status = 301

